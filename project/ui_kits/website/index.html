<!-- @dsCard group="Website UI kit" viewport="1280x800" name="Aluplan website (demo)" subtitle="Products, product detail, package comparison — one fixture, theme/mode switcher" -->
<!doctype html>
<html lang="tr" data-theme="aluplan" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aluplan — UI kit (demo)</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../data/select-content.js"></script>
<script src="../../tests/source-loader.js" data-root="../../"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="PreviewShell.jsx"></script>
<script type="text/babel" src="SitePage.jsx"></script>
<script type="text/babel" src="ProductsScreen.jsx"></script>
<script type="text/babel" src="ProductDetailScreen.jsx"></script>
<script type="text/babel" src="ComparisonScreen.jsx"></script>
<script type="text/babel">
const VIEWS = { '#products': 'ProductsScreen', '#product': 'ProductDetailScreen', '#compare': 'ComparisonScreen' };
function App() {
  const [content, setContent] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [hash, setHash] = React.useState(VIEWS[location.hash] ? location.hash : '#product');
  React.useEffect(() => {
    Promise.all([fetch('../../data/demo-content.json').then((r) => r.json()), fetch('../../data/ui-labels.tr.json').then((r) => r.json())]).then(([c, l]) => { window.UI = l; setContent(c); }).catch((e) => setError(String(e)));
    const on = () => { if (VIEWS[location.hash]) { setHash(location.hash); window.scrollTo(0, 0); } };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const Screen = window[VIEWS[hash]];
  if (!window.AluplanDesignSystem_84a18c) return <p style={{ padding: 24 }}>Tasarım sistemi paketi (_ds_bundle.js) yüklenemedi.</p>;
  return (
    <PreviewShell title="Aluplan UI kit">
      {error ? <p style={{ padding: 24 }}>İçerik yüklenemedi: {error}</p> : content ? <Screen content={content} /> : <p style={{ padding: 24 }}>Yükleniyor…</p>}
    </PreviewShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
