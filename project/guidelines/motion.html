<!-- @dsCard group="Motion" viewport="700x150" name="Motion + z-index" subtitle="Short fades only; prefers-reduced-motion → 0ms" -->
<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-page)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:48px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}.n{font-family:var(--font-mono);font-size:11px;line-height:1.3;color:var(--text-secondary);overflow-wrap:anywhere}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-primary)}.sc{padding:12px;border-radius:6px;background:var(--surface-page);display:flex;flex-direction:column;gap:8px}</style></head><body>
<div class="g" style="grid-template-columns:1fr 1fr"><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:4px 0"><span class="v">--motion-duration-fast</span><span class="n">150ms</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:4px 0"><span class="v">--motion-duration-base</span><span class="n">200ms</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:4px 0"><span class="v">--motion-duration-slow</span><span class="n">300ms</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:4px 0"><span class="v">--motion-easing-standard</span><span class="n">cubic-bezier(0.2,0,0,1)</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:4px 0"><span class="v">--z-sticky</span><span class="n">100</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:4px 0"><span class="v">--z-dropdown</span><span class="n">200</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:4px 0"><span class="v">--z-overlay</span><span class="n">300</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding:4px 0"><span class="v">--z-dialog</span><span class="n">400</span></div></div></body></html>
