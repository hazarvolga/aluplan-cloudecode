<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-page)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:48px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}.n{font-family:var(--font-mono);font-size:11px;line-height:1.3;color:var(--text-secondary);overflow-wrap:anywhere}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-primary)}.sc{padding:12px;border-radius:6px;background:var(--surface-page);display:flex;flex-direction:column;gap:8px}</style></head><body>
<div style="display:flex;gap:10px;align-items:flex-end"><div class="sw" style="align-items:center"><div style="width:var(--ref-space-1);height:var(--ref-space-1);background:var(--ref-color-blueprint-600)"></div><span class="n">1</span><span class="n">0.25rem</span></div><div class="sw" style="align-items:center"><div style="width:var(--ref-space-2);height:var(--ref-space-2);background:var(--ref-color-blueprint-600)"></div><span class="n">2</span><span class="n">0.5rem</span></div><div class="sw" style="align-items:center"><div style="width:var(--ref-space-3);height:var(--ref-space-3);background:var(--ref-color-blueprint-600)"></div><span class="n">3</span><span class="n">0.75rem</span></div><div class="sw" style="align-items:center"><div style="width:var(--ref-space-4);height:var(--ref-space-4);background:var(--ref-color-blueprint-600)"></div><span class="n">4</span><span class="n">1rem</span></div><div class="sw" style="align-items:center"><div style="width:var(--ref-space-5);height:var(--ref-space-5);background:var(--ref-color-blueprint-600)"></div><span class="n">5</span><span class="n">1.25rem</span></div><div class="sw" style="align-items:center"><div style="width:var(--ref-space-6);height:var(--ref-space-6);background:var(--ref-color-blueprint-600)"></div><span class="n">6</span><span class="n">1.5rem</span></div><div class="sw" style="align-items:center"><div style="width:var(--ref-space-8);height:var(--ref-space-8);background:var(--ref-color-blueprint-600)"></div><span class="n">8</span><span class="n">2rem</span></div><div class="sw" style="align-items:center"><div style="width:var(--ref-space-10);height:var(--ref-space-10);background:var(--ref-color-blueprint-600)"></div><span class="n">10</span><span class="n">2.5rem</span></div><div class="sw" style="align-items:center"><div style="width:var(--ref-space-12);height:var(--ref-space-12);background:var(--ref-color-blueprint-600)"></div><span class="n">12</span><span class="n">3rem</span></div><div class="sw"
