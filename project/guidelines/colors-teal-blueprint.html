<!-- @dsCard group="Colors" viewport="700x200" name="Teal + Blueprint (primitive)" subtitle="Teal = action/accent, Blueprint = link/focus/info" -->
<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-page)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:48px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}.n{font-family:var(--font-mono);font-size:11px;line-height:1.3;color:var(--text-secondary);overflow-wrap:anywhere}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-primary)}.sc{padding:12px;border-radius:6px;background:var(--surface-page);display:flex;flex-direction:column;gap:8px}</style></head><body>
<div class="g" style="grid-template-columns:repeat(7,minmax(0,1fr))"><div class="sw"><div class="chip" style="background:var(--ref-color-teal-50)"></div><span class="v">teal 50</span><span class="n">#EEFBF8</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-teal-300)"></div><span class="v">teal 300</span><span class="n">#2DD4BF</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-teal-400)"></div><span class="v">teal 400</span><span class="n">#5EEAD4</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-teal-700)"></div><span class="v">teal 700</span><span class="n">#0F766E</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-teal-800)"></div><span class="v">teal 800</span><span class="n">#115E59</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-teal-900)"></div><span class="v">teal 900</span><span class="n">#0F4744</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-teal-950)"></div><span class="v">teal 950</span><span class="n">#0B2E2C</span></div></div><div style="height:12px"></div><div class="g" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div class="sw"><div class="chip" style="background:var(--ref-color-blueprint-50)"></div><span class="v">blueprint 50</span><span class="n">#EEF4FF</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-blueprint-300)"></div><span class="v">blueprint 300</span><span class="n">#93C5FD</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-blueprint-400)"></div><span class="v">blueprint 400</span><span class="n">#60A5FA</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-blueprint-600)"></div><span class="v">blueprint 600</span><span class="n">#2563EB</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-blueprint-700)"></div><span class="v">blueprint 700</span><span class="n">#1D4ED8</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-blueprint-800)"></div><span class="v">blueprint 800</span><span class="n">#1E40AF</span></div></div></body></html>
