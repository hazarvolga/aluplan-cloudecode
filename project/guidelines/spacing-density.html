<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-page)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:48px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}.n{font-family:var(--font-mono);font-size:11px;line-height:1.3;color:var(--text-secondary);overflow-wrap:anywhere}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-primary)}.sc{padding:12px;border-radius:6px;background:var(--surface-page);display:flex;flex-direction:column;gap:8px}</style></head><body>
<div class="g" style="grid-template-columns:1fr 1fr"><div class="sc" data-theme="aluplan" data-mode="light" style="border:1px solid var(--border-default)"><span class="n">aluplan</span><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">inset-xs</span><div style="height:12px;width:var(--space-inset-xs);background:var(--accent-fg)"></div><span class="n">0.5rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">inset-sm</span><div style="height:12px;width:var(--space-inset-sm);background:var(--accent-fg)"></div><span class="n">0.75rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">inset-md</span><div style="height:12px;width:var(--space-inset-md);background:var(--accent-fg)"></div><span class="n">1.25rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">inset-lg</span><div style="height:12px;width:var(--space-inset-lg);background:var(--accent-fg)"></div><span class="n">2rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">control-h-sm</span><div style="width:12px;height:var(--control-height-sm);background:var(--status-info-border)"></div><span class="n">2.25rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">control-h-md</span><div style="width:12px;height:var(--control-height-md);background:var(--status-info-border)"></div><span class="n">2.75rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">control-h-lg</span><div style="width:12px;height:var(--control-height-lg);background:var(--status-info-border)"></div><span class="n">3.25rem</span></div></div><div class="sc" data-theme="field" data-mode="light" style="border:1px solid var(--border-default)"><span class="n">field</span><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">inset-xs</span><div style="height:12px;width:var(--space-inset-xs);background:var(--accent-fg)"></div><span class="n">0.25rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">inset-sm</span><div style="height:12px;width:var(--space-inset-sm);background:var(--accent-fg)"></div><span class="n">0.5rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">inset-md</span><div style="height:12px;width:var(--space-inset-md);background:var(--accent-fg)"></div><span class="n">1rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">inset-lg</span><div style="height:12px;width:var(--space-inset-lg);background:var(--accent-fg)"></div><span class="n">1.5rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">control-h-sm</span><div style="width:12px;height:var(--control-height-sm);background:var(--status-info-border)"></div><span class="n">2rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">control-h-md</span><div style="width:12px;height:var(--control-height-md);background:var(--status-info-border)"></div><span class="n">2.5rem</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:110px">control-h-lg</span><div style="width:12px;height:var(--control-height-lg);background:var(--status-info-border)"></div><span class="n">3rem</span></div></div></div></body></html>
