<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-page)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:48px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}.n{font-family:var(--font-mono);font-size:11px;line-height:1.3;color:var(--text-secondary);overflow-wrap:anywhere}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-primary)}.sc{padding:12px;border-radius:6px;background:var(--surface-page);display:flex;flex-direction:column;gap:8px}</style></head><body>
<div class="g" style="grid-template-columns:repeat(8,minmax(0,1fr))"><div class="sw"><div class="chip" style="background:var(--ref-color-silver-50)"></div><span class="v">silver 50</span><span class="n">#F5F7FA</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-silver-100)"></div><span class="v">silver 100</span><span class="n">#E6EAF0</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-silver-200)"></div><span class="v">silver 200</span><span class="n">#D3D9E2</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-silver-300)"></div><span class="v">silver 300</span><span class="n">#B8C0CC</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-silver-400)"></div><span class="v">silver 400</span><span class="n">#8E97A6</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-silver-500)"></div><span class="v">silver 500</span><span class="n">#6B7588</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-silver-600)"></div><span class="v">silver 600</span><span class="n">#566073</span></div><div class="sw"><div class="chip" style="background:var(--ref-color-silver-700)"></div><span class="v">silver 700</span><span class="n">#414A5C</span></div></div></body></html>
