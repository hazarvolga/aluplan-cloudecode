<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;font-family:var(--font-body);color:var(--text-primary);background:var(--surface-page)}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;min-width:0}.chip{height:48px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}.n{font-family:var(--font-mono);font-size:11px;line-height:1.3;color:var(--text-secondary);overflow-wrap:anywhere}.v{font-family:var(--font-mono);font-size:11px;color:var(--text-primary)}.sc{padding:12px;border-radius:6px;background:var(--surface-page);display:flex;flex-direction:column;gap:8px}</style></head><body>
<div class="g"><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:80px">bp sm</span><div style="height:10px;width:calc(30rem / 2.2);background:var(--ref-color-silver-300)"></div><span class="n">30rem · cols 4</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:80px">bp md</span><div style="height:10px;width:calc(48rem / 2.2);background:var(--ref-color-silver-300)"></div><span class="n">48rem · cols 8</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:80px">bp lg</span><div style="height:10px;width:calc(64rem / 2.2);background:var(--ref-color-silver-300)"></div><span class="n">64rem · cols 12</span></div><div style="display:flex;gap:8px;align-items:center"><span class="n" style="width:80px">bp xl</span><div style="height:10px;width:calc(80rem / 2.2);background:var(--ref-color-silver-300)"></div><span class="n">80rem · cols 12</span></div><span class="n">containers: sm 40rem · md 48rem · lg 64rem · xl 75rem · prose 68ch · gutter clamp(1rem, 4vw, 2rem)</span></div></body></html>
